# =============================================================================
# Nepali -- tokenizer configuration
# =============================================================================
# Independent from Hindi's: different corpus, different vocabulary, different
# model file. The assignment forbids sharing tokenizers or vocabularies between
# Model H and Model L, and the QA gate verifies the two .model files differ.

model_type: bpe
model_prefix: nepali_bpe

character_coverage: 0.9995
byte_fallback: false

# Capped to 5,000-10,000 per a course-TA ruling that supersedes the brief's
# "tens of thousands" guidance: at a ~25M-parameter model, a vocab as large
# as 24k makes the embedding table (vocab_size x model_dim) too large a
# share of the budget (~49% at d=512) - see report/phase1/tokenizer_analysis.md
# for the same arithmetic applied to Hindi and Bhojpuri. This applies to
# every model at this parameter budget, not just Hindi/Bhojpuri, so Nepali
# uses the identical range.
vocab_sizes: [5000, 6000, 8000, 10000]
preferred_min_vocab: 5000

selection:
  metric: fertility_elbow
  max_unk_rate: 0.002           # looser than Hindi's 0.1%: rarer characters
  min_relative_gain: 0.03

# If BPE fertility on Nepali looks poor, s11 also trains Unigram at the chosen
# vocabulary size and keeps whichever scores better. Nepali's agglutinative
# morphology is exactly the case where Unigram's probabilistic segmentation
# tends to beat greedy BPE merges, so the comparison is worth the run and is a
# genuine finding for the H/L discussion.
compare_unigram:
  enabled: true
  trigger_fertility_above: 2.10   # tokens per whitespace word

training:
  input_sentence_size: 3_000_000
  shuffle_input_sentence: true
  num_threads: 8
  max_sentence_length: 8192
  normalization_rule_name: identity

special_tokens:
  pad: '<pad>'
  unk: '<unk>'
  bos: '<s>'
  eos: '</s>'

report:
  top_tokens: 50
  n_examples: 10
