# Model H (Hindi) - BONUS ABLATION: positional embeddings removed.
#
# This file is deliberately a near-copy of model.yaml. Every value below is
# IDENTICAL to the standard Model H run except two:
#
#   1. pos_encoding: learned -> none
#   2. out_dir: checkpoints/hindi -> checkpoints/hindi_nopos
#
# Everything else - vocabulary, block size, depth, width, head count, d_ff,
# dropout, weight tying, learning rate, schedule shape, warmup, weight decay,
# betas, gradient clipping, batch size, gradient accumulation, eval cadence and
# **the seed** - is held fixed, so the only thing that differs between the two
# runs is whether the model has access to position information. Holding the seed
# fixed matters as much as holding the hyperparameters fixed: the data loader is
# seeded from it, so both runs see the same batches in the same order.
#
# Hindi was chosen over Nepali because its tokenizer has byte fallback and a
# measured 0.000000 unknown-token rate, so no part of any difference observed
# here can be attributed to <unk> noise in the corpus.

model:
  vocab_size: 8000
  block_size: 512

  n_layer: 6
  n_head: 8
  n_embd: 512
  d_ff: 2048

  dropout: 0.1
  bias: true
  tie_weights: true

  # THE ABLATED VARIABLE. "none" skips the positional term entirely: token
  # embeddings go into block 0 with no position added. Self-attention is
  # permutation invariant, so this model cannot distinguish "A is bigger than B"
  # from "B is bigger than A" - it sees a bag of tokens.
  #
  # It removes 512 x 512 = 262,144 parameters (the position table). The
  # non-embedding parameter count is UNCHANGED at 18,915,328, so the Transformer
  # stack being compared is the same size in both runs.
  pos_encoding: none

  init_std: 0.02

train:
  language: hindi
  data_dir: hindi/data/packed
  out_dir: checkpoints/hindi_nopos

  # Left at 15,000 even though this run is wall-clock limited to far fewer
  # steps. max_steps sets the cosine schedule's horizon, so keeping it equal to
  # the baseline's means the learning rate at any given step is IDENTICAL in
  # both runs. Shortening it here would decay the rate faster and confound the
  # ablation with a learning-rate difference.
  max_steps: 15000

  batch_size: 32
  grad_accum_steps: 2

  learning_rate: 6.0e-4
  min_lr: 6.0e-5
  warmup_steps: 500
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0

  eval_interval: 500
  eval_iters: 100
  log_interval: 20

  checkpoint_interval: 500
  keep_last_n: 2

  # Identical to the standard run, so both models see the same batch order.
  seed: 20260902
  device: auto
  dtype: float16
  compile_model: false

notes: >
  Bonus ablation for Model H (Hindi): positional embeddings removed
  (pos_encoding: none). Compared against the standard Model H run step for step.
  Total parameters 23,011,328 vs 23,273,472; non-embedding parameters identical
  at 18,915,328.
